[project]
name = "ala"
version = "0.1.0"
description = "Ala: a bilingual (Telugu and English) voice shopping assistant for a coastal marketplace"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "livekit-agents[silero,turn-detector,openai,google]>=1.8,<1.9",
    "livekit-plugins-sarvam>=1.8,<1.9",
    "livekit-plugins-gladia>=1.8,<1.9",
    "livekit-plugins-noise-cancellation>=0.2",
    "numpy>=2.0",
    "onnxruntime>=1.20",
    "rapidfuzz>=3.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "aiohttp>=3.10",
    "asyncpg>=0.29",
    "huggingface-hub>=0.25",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "soundfile>=0.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.uv]
package = false
